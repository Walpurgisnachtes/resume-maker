<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>{{name}} | Resume</title>
<style>
  @page { size: 210mm 269.32mm; margin: 0; }
  @font-face { font-family: "Resume Title"; src: local("Inter 18pt Light"), local("Inter18pt-Light"); font-weight: 300; }
  :root { --paper-width: 210mm; --paper-height: 269.32mm; }
  * { box-sizing: border-box; }
  body { margin: 0; color: #181818; font: 11pt/4.5mm Arial, sans-serif; }
  .resume {
    --sidebar-width: 38.14%;
    --divider-start: calc(var(--sidebar-width) - .4mm);
    --divider-end: calc(var(--divider-start) + .59mm);
    display: grid;
    grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
    width: var(--paper-width);
    min-height: var(--paper-height);
    overflow-wrap: anywhere;
    background: linear-gradient(90deg, #ebebeb 0 var(--divider-start), #aaa var(--divider-start) var(--divider-end), #fff var(--divider-end));
  }
  .sidebar { display: flex; flex-direction: column; justify-content: space-between; gap: 8mm; padding: 9.5mm 8.05mm 9.5mm 8.3mm; }
  .photo { display: block; width: 100%; height: 82.46mm; object-fit: cover; object-position: center; filter: grayscale(1); margin-bottom: 6.7mm; }
  h1 { margin: 0; font: 300 47pt/16mm "Resume Title", Inter, "Segoe UI Light", Arial, sans-serif; letter-spacing: -.045em; white-space: pre-line; }
  .contact { font-size: 10.7pt; line-height: 5.1mm; }
  main { min-width: 0; padding: 10.6mm 10.1mm 8mm 7.1mm; }
  section + section { margin-top: 4.55mm; }
  h2 { display: flex; justify-content: space-between; font-size: 14.5pt; line-height: 6.6mm; font-weight: normal; border-bottom: .32mm solid #888; margin: 0 0 2.7mm -1mm; padding-inline: 1.2mm 1.7mm; }
  .section-body { padding-inline: .2mm .6mm; }
  p { margin: 0; }
  .profile { white-space: pre-line; }
  .section-profile + section { margin-top: 5.6mm; }
  article + article { margin-top: 4.55mm; }
  .entry-heading { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 0 2.5mm; }
  h3 { font-size: inherit; font-weight: normal; margin: 0; }
  .period { justify-self: end; max-width: 24mm; font-size: 10pt; text-align: right; }
  ul { list-style-type: disc; margin: 0; padding-left: 3.6mm; }
  li::marker { font-size: .73em; }
  .section-education h2 { margin-bottom: 3.4mm; }
  .skills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2mm .8mm; }
  .skill-group { display: grid; grid-template-columns: 18mm minmax(0, 1fr); line-height: 5.05mm; }
  .skill-group > ul:only-child { grid-column: 1 / -1; }
  .skill-group h3, .section-experience h3 { text-decoration: underline; text-underline-offset: .07em; }
  .section-experience h3 { text-transform: uppercase; }
  .section-experience h2 { margin-bottom: 4.6mm; }
  .section-experience article + article { margin-top: 3.35mm; }
  article ul { margin-top: 4.2mm; padding-left: 8.6mm; }
  @media screen {
    .resume {
      margin-inline: auto;
      zoom: min(1, calc(100vw / var(--paper-width)), calc(100vh / var(--paper-height)));
    }
  }
  @media print { .resume { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
</style>
<div class="resume">
  <aside class="sidebar" aria-label="Candidate">
    <header>
      {{photo}}
      {{role}}
    </header>
    {{contact}}
  </aside>
  <main>{{sections}}</main>
</div>
</html>
